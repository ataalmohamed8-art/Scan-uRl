<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Phishing & Security Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 25px;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            text-align: right;
        }

        .safe {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .danger {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #f87171;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ URL PHISHING & SECURITY ]<br>[ SCANNER ]</h1>
        
        <div class="input-group">
            <label for="urlInput">أدخل الرابط المراد فحصه (URL):</label>
            <input type="text" id="urlInput" placeholder="https://example.com">
        </div>

        <button onclick="analyzeURL()">تحليل وفحص الرابط</button>

        <div id="result"></div>
    </div>

    <script>
        function analyzeURL() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!urlInput) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'danger';
                resultDiv.innerHTML = '⚠️ برجاء إدخال رابط صحيح أولاً!';
                return;
            }

            // محاكاة عملية الفحص الأمني للرابط
            resultDiv.style.display = 'block';
            resultDiv.className = 'safe';
            
            // مثال بسيط لفحص الكلمات المشبوهة أو بروتوكول الأمان
            if (urlInput.includes('phish') || urlInput.includes('hack') || urlInput.startsWith('http://')) {
                resultDiv.className = 'danger';
                resultDiv.innerHTML = '🚨 تحذير: هذا الرابط قد يكون غير آمن أو مشبوه (يحتوي على إشارات تصيد أو بروتوكول غير مشفر)!';
            } else {
                resultDiv.className = 'safe';
                resultDiv.innerHTML = '✅ الرابط يبدو آمناً بناءً على الفحص الأولي (بروتوكول HTTPS نشط وخالٍ من الكلمات المشبوهة).';
            }
        }
    </script>

</body>
</html>
